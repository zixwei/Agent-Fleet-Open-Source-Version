# Fleet Kit: unit tests + no-key green-path demo on every change to fleet-kit/.
name: fleet-kit

on:
  pull_request:
    paths:
      - "fleet-kit/**"
      - ".github/workflows/fleet-kit.yml"
  push:
    branches: [main]
    paths:
      - "fleet-kit/**"
      - ".github/workflows/fleet-kit.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fleet-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Green-path demo (no model keys)
        env:
          FLEET_SKIP_PIP: "1"
        run: bash demo.sh
